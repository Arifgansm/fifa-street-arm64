name: Android APK build

# Builds the FIFA Street (ReStreet) Android APK for ARM64.
# Uses GitHub's x86-64 runner with QEMU for cross-compilation.
# The build includes native libraries but NO game data (no OBB).
# Game data must be provided by the user on their device.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "ReStreet commit or branch (default: upstream.json)"
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build pkgconf qemu-user-static \
            openjdk-17-jdk-headless python3-jinja2 curl tar xz-utils file unzip
          
          # Set up Java
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          
          # Android SDK command line tools (latest stable)
          ANDROID_SDK_ROOT="/home/runner/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          
          export ANDROID_SDK_ROOT
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          # Accept licenses and install platforms/tools (no NDK from sdkmanager)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0" > /dev/null
          
          # Download NDK r27 directly (has Clang 18+ required by ReXGlue)
          NDK_VERSION="r27d"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "Downloading NDK $NDK_VERSION from $NDK_URL"
          wget -q "$NDK_URL" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt/
          NDK_DIR="/opt/android-ndk-${NDK_VERSION//r/}"
          echo "NDK installed at $NDK_DIR"
          ls "$NDK_DIR/build/cmake/android.toolchain.cmake" && echo "Toolchain file found"
          
          # Verify
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK_DIR=$NDK_DIR"
          echo "Platforms: $(ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo 'NOT FOUND')"

      - uses: actions/checkout@v5

      - name: Fetch pinned host toolchain (LLVM, CMake, Ninja, sysroot)
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"

      - name: Prepare ReStreet and patched SDK
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE"
          work="$RUNNER_TEMP/work"
          mkdir -p "$work"
          
          field() {
            python3 -c "import json,sys; print(json.load(open('$repo/upstream.json'))['$1'])"
          }
          
          ref="${REF:-$(field commit)}"
          rs="$work/ReStreet"
          sdk="$work/rexglue-sdk"
          
          exec > "$RUNNER_TEMP/prepare_output.txt" 2>&1
          
          echo "=== Cloning ReStreet ==="
          git clone -q -c core.autocrlf=false "$(field repository)" "$rs" || true
          cd "$rs"
          git fetch -q origin "$ref" 2>/dev/null || git fetch -q origin
          git checkout -q --force "$ref"
          git clean -fdq -e generated -e out -- Installer/recomp-template || true
          echo "ReStreet $(git rev-parse --short HEAD)"
          cd "$repo"
          
          echo "=== Cloning SDK ==="
          sdk_commit="$(field sdk_commit)"
          git clone -q -c core.autocrlf=false "$(field sdk_repository)" "$sdk" || true
          cd "$sdk"
          git checkout -q --force "$sdk_commit"
          git clean -fdq -- include src resources cmake || true
          echo "SDK $(git describe --tags --always)"
          cd "$repo"
          
          echo "=== Initializing submodules ==="
          for sub in cli11 libmspack FFmpeg tomlplusplus simde xxHash spdlog fmt utfcpp imgui sdl3 \
                     vulkan-headers vulkan-memory-allocator spirv-headers spirv-tools glslang o1heap; do
            if [ ! -d "$sdk/thirdparty/$sub/.git" ] && [ ! -f "$sdk/thirdparty/$sub/.git" ]; then
              echo "Init: $sub"
              if ! git -C "$sdk" submodule update --init --depth 1 "thirdparty/$sub"; then
                echo "ERROR: Failed to init $sub"
                exit 1
              fi
            else
              echo "Skip: $sub (already exists)"
            fi
          done
          echo "Submodules initialized"
          
          echo "=== Applying patches ==="
          # Apply ReStreet's local changes patch
          if ! git -C "$sdk" apply --whitespace=nowarn "$rs/patches/rexglue-local-changes.patch"; then
            echo "ERROR: ReStreet patch failed"
            exit 1
          fi
          echo "Applied ReStreet's patches/rexglue-local-changes.patch"
          
          # Apply our SDK patches
          for patch in "$repo"/patches/sdk/*.patch; do
            [ -e "$patch" ] || continue
            if ! git -C "$sdk" apply --whitespace=nowarn "$patch"; then
              echo "ERROR: Patch $(basename $patch) failed to apply"
              exit 1
            fi
            echo "Applied $(basename $patch)"
          done
          
          # Apply game patches
          for patch in "$repo"/patches/game/*.patch; do
            [ -e "$patch" ] || continue
            if ! git -C "$rs" apply --whitespace=nowarn "$patch"; then
              echo "ERROR: Game patch $(basename $patch) failed to apply"
              exit 1
            fi
            echo "Applied $(basename $patch)"
          done
          echo "Prepare complete"

      - name: Upload prepare logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-logs
          path: |
            ${{ runner.temp }}/work/ReStreet/.git/logs/HEAD
            ${{ runner.temp }}/work/rexglue-sdk/.git/logs/HEAD
            ${{ runner.temp }}/prepare_output.txt
          retention-days: 5

      - name: Build ReXGlue SDK for Android (NDK)
        id: rexglue_build
        env:
          ANDROID_NDK: /opt/android-ndk-r27d
        run: |
          set -euo pipefail
          export ANDROID_NDK="/opt/android-ndk-r27d"
          export ANDROID_SDK="/home/runner/android-sdk"
          repo=$(pwd)
          cd "$RUNNER_TEMP/work"
          sdk_src="rexglue-sdk"
          sdk_install="$sdk_src/out/install/android-arm64"
          ndk_toolchain="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          
          arch="-march=armv8.2-a+rcpc -mtune=cortex-a715"
          SOURCE_DATE_EPOCH="$(git -C "$sdk_src" log -1 --format=%ct 2>/dev/null || echo 0)"
          export SOURCE_DATE_EPOCH

          # Debug: verify patch was applied
          echo "=== Checking patched file ==="
          grep -n "ANDROID" "$sdk_src/src/ui/CMakeLists.txt" | head -5

          # Run cmake configure and capture log
          {
            cmake -S "$sdk_src" -B "$sdk_src/out/build/android-arm64" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ndk_toolchain" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-34 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_C_FLAGS="$arch" \
              -DCMAKE_CXX_FLAGS="$arch" \
              -DCMAKE_INSTALL_PREFIX="$sdk_install" \
              -DREXGLUE_USE_VULKAN=ON \
              -DREXGLUE_ENABLE_TRACY=OFF \
              -DSDL_HIDAPI_LIBUSB=OFF \
              -DSDL_VIDEO=ON \
              -DSDL_X11=OFF \
              -DSDL_WAYLAND=OFF \
              -DSDL_X11_SHARED=OFF \
              -DSDL_WAYLAND_SHARED=OFF
          } 2>&1 | tee "$RUNNER_TEMP/rexglue_cmake.log"
          
          # Run build and capture log
          {
            cmake --build "$sdk_src/out/build/android-arm64" --config Release --target install --parallel "$(nproc)"
          } 2>&1 | tee -a "$RUNNER_TEMP/rexglue_build.log"
          
          for f in "$sdk_install/lib/librexruntime.so" "$sdk_install/lib/librexgpu-xenos.so"; do
            [ -e "$f" ] || { echo "error: $f was not built" >&2; exit 1; }
            [ "$(od -An -tx1 -j18 -N2 "$f" | tr -d ' \n')" = b700 ] || { echo "error: $f is not aarch64" >&2; exit 1; }
            echo "OK $f (aarch64)"
          done

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/rexglue_cmake.log
            ${{ runner.temp }}/rexglue_build.log
            ${{ runner.temp }}/work/ReStreet/logs/*
          retention-days: 5

      - name: Build SDL3 for Android
        env:
          ANDROID_NDK: /opt/android-ndk-r27d
          ANDROID_SDK: /home/runner/android-sdk
        run: |
          export ANDROID_NDK="/opt/android-ndk-r27d"
          export ANDROID_SDK="/home/runner/android-sdk"
          ndk_toolchain="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          
          sdl_dir="$RUNNER_TEMP/sdl3"
          sdl_build="$RUNNER_TEMP/sdl3-build"
          
          if [ ! -d "$sdl_dir" ]; then
            git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL "$sdl_dir"
          fi
          
          cmake -S "$sdl_dir" -B "$sdl_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk_toolchain" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_VULKAN=ON \
            -DSDL_JOYSTICK=ON \
            -DSDL_GAMEPAD=ON \
            -DSDL_SENSOR=ON \
            -DSDL_THREADS=ON \
            -DSDL_FILESYSTEM=ON
          
          cmake --build "$sdl_build" --parallel "$(nproc)"
          
          libSDL3="$sdl_build/build/outputs/native/release/libSDL3.so"
          [ -f "$libSDL3" ] || libSDL3="$sdl_build/libSDL3.so"
          [ -f "$libSDL3" ] || { echo "error: libSDL3.so was not built" >&2; exit 1; }
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$libSDL3" android/app/src/main/jniLibs/arm64-v8a/
          echo "OK libSDL3.so (aarch64)"

      - name: Generate placeholder recompiled code
        run: |
          cd "$RUNNER_TEMP/work/ReStreet/Installer/recomp-template"
          python3 "$GITHUB_WORKSPACE/scripts/placeholder-codegen.py" . "$RUNNER_TEMP/work/rexglue-sdk"

      - name: Build game for Android
        env:
          ANDROID_NDK: /opt/android-ndk-r27d
          ANDROID_SDK: /home/runner/android-sdk
        run: |
          export ANDROID_NDK="/opt/android-ndk-r27d"
          export ANDROID_SDK="/home/runner/android-sdk"
          ndk_toolchain="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          
          project="$RUNNER_TEMP/work/ReStreet/Installer/recomp-template"
          sdk_install="$RUNNER_TEMP/work/rexglue-sdk/out/install/android-arm64"
          game_build="$project/out/android-arm64"
          
          jobs=$(nproc)
          
          cmake -S "$project" -B "$game_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk_toolchain" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_FIND_ROOT_PATH="$sdk_install" \
            -DCMAKE_PREFIX_PATH="/;$sdk_install" \
            -DREXGLUE_EXTERNAL_CODEGEN=ON \
            -DREXGLUE_RECOMP_DEBUG_INFO=none
          
          cmake --build "$game_build" --parallel "$jobs"
          
          for f in "$game_build/fifastreet" "$game_build/libfifastreet_fifadllzf_xex.so" "$game_build/libfifastreet_FootballCompEngzf_xex.so"; do
            [ -e "$f" ] || { echo "error: $f was not built" >&2; exit 1; }
            [ "$(od -An -tx1 -j18 -N2 "$f" | tr -d ' \n')" = b700 ] || { echo "error: $f is not aarch64" >&2; exit 1; }
            echo "OK $f (aarch64)"
          done

      - name: Copy native libraries to Android project
        env:
          ANDROID_NDK: /opt/android-ndk-r27d
        run: |
          prebuilt="android/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$prebuilt"
          mkdir -p "$prebuilt"
          
          project="$RUNNER_TEMP/work/ReStreet/Installer/recomp-template"
          sdk_install="$RUNNER_TEMP/work/rexglue-sdk/out/install/android-arm64"
          game_build="$project/out/android-arm64"
          
          # The fifastreet executable becomes libmain.so (loaded by SDLActivity)
          cp "$game_build/fifastreet" "$prebuilt/libfifastreet.so"
          
          # SDK libraries
          cp "$sdk_install/lib/librexruntime.so" "$prebuilt/"
          cp "$sdk_install/lib/librexgpu-xenos.so" "$prebuilt/"
          
          # Guest modules
          cp "$game_build/libfifastreet_fifadllzf_xex.so" "$prebuilt/"
          cp "$game_build/libfifastreet_FootballCompEngzf_xex.so" "$prebuilt/"
          
          # Strip to reduce APK size
          strip_tool="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "$strip_tool" ]; then
            "$strip_tool" "$prebuilt"/*.so 2>/dev/null || true
            echo "Stripped with $strip_tool"
          fi
          
          ls -lh "$prebuilt"/
          
          # Android game config
          cp "config/fifastreet-android.toml" "$prebuilt/fifastreet.toml"

      - name: Build APK with Gradle
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cd android
          echo "sdk.dir=/home/runner/android-sdk" > local.properties
          
          # The gradle wrapper JAR is at gradle/wrapper/gradle/wrapper/gradle-wrapper.jar
          WRAPPER_JAR="gradle/wrapper/gradle/wrapper/gradle-wrapper.jar"
          
          # Build release APK
          java -cp "$WRAPPER_JAR" \
            org.gradle.wrapper.GradleWrapperMain \
            :app:assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            -Pndk.dir="/opt/android-ndk-r27d"
          
          apk_path=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "APK: $apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifastreet-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Verify APK architecture
        run: |
          apk_path=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          unzip -l "$apk_path" | grep -E "lib/(arm64-v8a|arm64)/" || { echo "ERROR: No arm64 libraries found in APK"; exit 1; }
          echo "APK contains arm64-v8a native libraries ✓"
